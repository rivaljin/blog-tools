<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매장 안내 방송</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'맑은 고딕','Malgun Gothic',sans-serif;background:#1a1a2e;color:#eee;min-height:100vh;padding:20px}
.container{max-width:700px;margin:0 auto}
h1{font-size:24px;text-align:center;margin-bottom:8px}
.subtitle{text-align:center;color:#aaa;font-size:14px;margin-bottom:30px}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.announce-btn{border:none;border-radius:16px;padding:36px 16px;font-size:22px;font-weight:bold;cursor:pointer;color:#fff;line-height:1.5;transition:transform .1s, opacity .1s;font-family:inherit}
.announce-btn:active{transform:scale(.97)}
.announce-btn small{display:block;font-size:14px;font-weight:normal;opacity:.85;margin-top:8px}
.btn-wait{background:#e67e22}
.btn-pack{background:#3498db}
.btn-ready{background:#27ae60}
.btn-thanks{background:#8e44ad}
.custom{background:#16213e;border-radius:16px;padding:20px;margin-bottom:24px}
.custom h2{font-size:16px;margin-bottom:12px}
.custom-row{display:flex;gap:8px}
.custom-row input{flex:1;padding:14px;border:1px solid #444;border-radius:8px;font-size:16px;background:#0f3460;color:#eee;font-family:inherit}
.custom-row button{background:#e8a838;color:#fff;border:none;padding:14px 24px;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit}
.settings{background:#16213e;border-radius:16px;padding:20px}
.settings h2{font-size:16px;margin-bottom:12px}
.settings label{display:block;font-size:13px;color:#aaa;margin:10px 0 4px}
.settings input[type=range]{width:100%}
.settings .val{color:#e8a838;font-weight:bold}
#status{text-align:center;color:#2ecc71;font-size:15px;min-height:24px;margin-bottom:16px}
.stop-btn{width:100%;background:#c0392b;color:#fff;border:none;padding:16px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-bottom:24px;font-family:inherit}
</style>
</head>
<body>
<div class="container">
<h1>📢 매장 안내 방송</h1>
<p class="subtitle">버튼을 누르면 안내 음성이 나옵니다</p>
<div id="status"></div>

<div class="btn-grid">
<button class="announce-btn btn-wait" onclick="speak(this.dataset.text)" data-text="기사님, 준비가 되면 조리완료 버튼을 눌러드리겠습니다. 잠시만 기다려 주십시오.">
⏳ 기다려 주세요
<small>준비가 되면 조리완료 버튼을 눌러드리겠습니다</small>
</button>
<button class="announce-btn btn-pack" onclick="speak(this.dataset.text)" data-text="기사님, 지금 포장 중입니다. 조금만 더 기다려 주십시오.">
📦 포장 중입니다
<small>지금 포장 중입니다</small>
</button>
<button class="announce-btn btn-ready" onclick="speak(this.dataset.text)" data-text="기사님, 주문하신 음식이 나왔습니다. 전표의 코드를 한 번 확인하시고요, 안전운전 하세요.">
✅ 음식 나왔습니다
<small>코드 확인하시고, 안전운전 하세요</small>
</button>
<button class="announce-btn btn-thanks" onclick="speak(this.dataset.text)" data-text="기사님, 감사합니다. 안전운전 하세요.">
🙏 감사합니다
<small>안전운전 하세요</small>
</button>
</div>

<button class="stop-btn" onclick="stopSpeak()">⏹ 음성 정지</button>

<div class="custom">
<h2>직접 입력해서 말하기</h2>
<div class="custom-row">
<input type="text" id="customText" placeholder="할 말을 입력하세요" onkeydown="if(event.key==='Enter')speakCustom()">
<button onclick="speakCustom()">말하기</button>
</div>
</div>

<div class="settings">
<h2>음성 설정</h2>
<label>속도: <span class="val" id="rateVal">1.0</span></label>
<input type="range" id="rate" min="0.6" max="1.4" step="0.1" value="1.0" oninput="document.getElementById('rateVal').textContent=this.value">
<label>볼륨: <span class="val" id="volVal">1.0</span></label>
<input type="range" id="volume" min="0.2" max="1" step="0.1" value="1" oninput="document.getElementById('volVal').textContent=this.value">
</div>
</div>

<script>
function getVoice(){
  const voices = speechSynthesis.getVoices();
  // 한국어 여성 음성 우선, 없으면 한국어 음성
  return voices.find(v=>v.lang.startsWith('ko') && /female|여성|Yuna|유나/i.test(v.name))
      || voices.find(v=>v.lang.startsWith('ko'))
      || voices[0];
}
function speak(text){
  if(!text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = getVoice();
  if(v) u.voice = v;
  u.lang = 'ko-KR';
  u.rate = parseFloat(document.getElementById('rate').value);
  u.volume = parseFloat(document.getElementById('volume').value);
  const st = document.getElementById('status');
  st.textContent = '🔊 재생 중: ' + text;
  u.onend = ()=>{ st.textContent=''; };
  u.onerror = ()=>{ st.textContent='⚠️ 음성 재생에 실패했습니다'; };
  speechSynthesis.speak(u);
}
function speakCustom(){
  const t = document.getElementById('customText').value.trim();
  if(t) speak(t);
}
function stopSpeak(){
  speechSynthesis.cancel();
  document.getElementById('status').textContent='';
}
// 음성 목록 미리 로드
if('speechSynthesis' in window){
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = ()=>speechSynthesis.getVoices();
}else{
  document.getElementById('status').textContent='⚠️ 이 브라우저는 음성 합성을 지원하지 않습니다. 크롬을 사용해 주세요.';
}
</script>
</body>
</html>
